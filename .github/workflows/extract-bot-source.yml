
name: Extract sanitized bot source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath, Path

          with zipfile.ZipFile("pdfbot.zip") as z:
              for info in z.infolist():
                  p = PurePosixPath(info.filename)
                  if info.is_dir() or p.is_absolute() or ".." in p.parts:
                      continue
                  if any(x in {"portadas", "logs", ".git", "__pycache__"} for x in p.parts):
                      continue
                  if p.name in {"token.txt", "config.txt", "estado.json"}:
                      continue
                  if p.suffix.lower() in {".pyc", ".log"}:
                      continue
                  out = Path("bot-source-review").joinpath(*p.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(z.read(info))
          PY

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot-source-review
          git diff --cached --quiet || (
            git commit -m "Extract sanitized source for review" &&
            git push
          )
