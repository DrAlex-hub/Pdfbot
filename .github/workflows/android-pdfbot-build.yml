name: Build Android PDF Bot

on:
  push:
    branches:
      - android-telegram-bot
    paths:
      - "android-app/pdfbot_android/**"
      - ".github/workflows/android-pdfbot-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-app/pdfbot_android :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDFBot-Hitomi-debug
          path: android-app/pdfbot_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
